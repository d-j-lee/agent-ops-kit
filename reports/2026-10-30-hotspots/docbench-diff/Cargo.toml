[package]
name = "docdiff"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "docdiff-bench"
path = "src/bench.rs"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-gencat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.2", default-features = false, features = ["text"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
