[package]
name = "atlas-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }   # Python 이 쓴 실수를 1 ULP 오차 없이 읽는다(반올림 경계에서 결과가 갈리지 않게)

[profile.release]
codegen-units = 1
lto = "thin"
