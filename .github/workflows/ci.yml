# Runs the repo's own checks on every pull request and on main.
#   checks:  schema/script/site/harness unit tests, the public-repo hygiene scan and the ⑦ mutation self-check (stdlib only)
#   harness: the ⑧ harness mutation self-check and the Rust adapter against a real fsmap
#   console: the console's inbox rules in headless Chromium (holdout cases, get_session enrichment, snapshot fallback)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Public-repo hygiene scan
        run: python -I scripts/secret_scan.py --strict .
      - name: Hub builds (registry and figure rules)
        run: python -I scripts/build_site.py --check
      - name: Tests are not vacuous (feature ⑦ self-check)
        # each mutation switches off one documented guard; the test named in its "expect" must fail for every one
        run: |
          python -I scripts/vacuity_check.py --repo . --jobs 4 --timeout 300 \
            --test "python -m unittest tests.test_regress_tools.DiffcheckTests" --mutations tests/mutations/diffcheck.json
          python -I scripts/vacuity_check.py --repo . --jobs 4 --timeout 300 \
            --test "python -m unittest tests.test_regress_tools.VacuityCheckTests" --mutations tests/mutations/vacuity_check.json
          python -I scripts/vacuity_check.py --repo . --jobs 4 --timeout 300 \
            --test "python -m unittest tests.test_site.BuildCheckTests" --mutations tests/mutations/build_site.json

  harness:
    # ⑧ self-check, separate job so it runs beside the others: each mutation switches off one guard of the
    # work-repo harness and the test named in its "expect" must fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Harness tests are not vacuous
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          python -I scripts/vacuity_check.py --repo . --jobs 4 --timeout 600 \
            --test "python -m unittest tests.test_harness" --mutations tests/mutations/harness.json
      - name: Rust adapter against a real fsmap (pinned commit)
        # the stubbed tests fix the contract; this checks it against the first-round harness itself
        run: |
          cargo install --git https://github.com/d-j-lee/filesystemMap --rev 74b7ffb --locked --root "$RUNNER_TEMP/fsmap"
          AOK_FSMAP="$RUNNER_TEMP/fsmap/bin/fsmap" python -m unittest tests.test_harness.RealFsmapTests -v

  console:
    # Pinned: Playwright 1.56 ships Chromium only for the Ubuntu releases it supports (ubuntu-latest moved to 26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Console inbox tests
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: python -m unittest tests.test_console_inbox -v
